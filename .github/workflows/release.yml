name: Release

on:
  push:
    branches: [master]
    paths: [manifest.json]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          PREVIOUS=$(git show HEAD~1:manifest.json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          AUTH_ORIGIN=$(python3 - <<'PY'
          import json
          from urllib.parse import urlparse

          manifest = json.load(open("manifest.json"))
          token_url = manifest.get("mcp", {}).get("auth", {}).get("token_url", "")
          parsed = urlparse(token_url)
          print(f"{parsed.scheme}://{parsed.netloc}" if parsed.scheme and parsed.netloc else "")
          PY
          )
          case "$AUTH_ORIGIN" in
            "https://app.ludflow.com")
              BUILD_CHANNEL="production"
              ;;
            "https://staging.app.ludflow.com")
              BUILD_CHANNEL="staging"
              ;;
            *)
              echo "::error::Unsupported Ludflow auth origin: ${AUTH_ORIGIN:-missing}"
              exit 1
              ;;
          esac
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "build_channel=$BUILD_CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        if: steps.version.outputs.changed == 'true'
        env:
          LUDFLOW_MCPVIEWS_BUILD_CHANNEL: ${{ steps.version.outputs.build_channel }}
        run: bash build.sh

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          ZIP_NAME="ludflow-plugin.zip"
          # Use RELEASE_NOTES.md if it has content beyond the header, otherwise auto-generate
          BODY=$(sed '1{/^# Unreleased$/d;}' RELEASE_NOTES.md | sed '/^$/d')
          if [ -n "$BODY" ]; then
            gh release create "$VERSION" "release/${ZIP_NAME}" \
              --title "$VERSION" \
              --notes "$BODY"
          else
            gh release create "$VERSION" "release/${ZIP_NAME}" \
              --title "$VERSION" \
              --generate-notes
          fi

      - name: Trigger DecidR MCPViews installer rebuild
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MCPVIEWS_RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MCPVIEWS_RELEASE_DISPATCH_TOKEN is not configured; skipping MCPViews installer rebuild dispatch."
            exit 0
          fi
          VERSION="v${{ steps.version.outputs.current }}"
          jq -n \
            --arg source_repo "DeeJanuz/ludflow-mcpviews" \
            --arg source_tag "$VERSION" \
            '{event_type:"branded-bundle-refresh", client_payload:{source_repo:$source_repo, source_tag:$source_tag}}' \
            | gh api repos/DeeJanuz/mcpviews/dispatches --method POST --input -

      - name: Clear release notes
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Unreleased" > RELEASE_NOTES.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "chore: clear release notes after v${{ steps.version.outputs.current }}"
          git push
